<!DOCTYPE html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>晞光</title>
		<!--
		晞光的網頁外殼（export_presets 的 html/custom_html_shell）。以 Godot 4.7 預設的 html shell 為底：
		$GODOT_* 佔位、啟動與錯誤處理的邏輯照舊，只把 <progress> 換成遊戲風格的載入框。
		字型 loading-font.ttf 是 Cubic 11 的子集（只含這頁用到的字），匯出腳本 tools/export_web.ps1 會複製到 docs/。
		改了這頁的文字要重切字型：python tools/make_loading_font.py
		-->
		<style>
@font-face {
	font-family: "Cubic11Load";
	src: url("loading-font.ttf") format("truetype");
	font-display: block;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	height: 100%;
}

body {
	color: white;
	background-color: #080a1a;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	bottom: 0;
}

#status {
	background-color: #080a1a;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

/* 載入框、錯誤訊息：遊戲 UI 的深藍底＋暖金描邊 */
.load-box {
	position: absolute;
	left: 50%;
	bottom: 9%;
	transform: translateX(-50%);
	box-sizing: border-box;
	width: min(56vw, 520px);
	min-width: 240px;
	max-width: calc(100vw - 24px);
	padding: 12px 16px 14px;
	background: rgba(20, 26, 46, 0.94);
	border: 2px solid #f2d98c;
	box-shadow: 0 0 0 2px #0a0d1a, 0 0 18px rgba(255, 219, 128, 0.18);
	font-family: "Cubic11Load", monospace;
	color: #f5f2e6;
	image-rendering: pixelated;
	z-index: 1;
}

#status-progress, #status-notice {
	display: none;
}

#load-row {
	display: flex;
	justify-content: space-between;
	align-items: baseline;
	font-size: 22px;
	line-height: 1;
	margin-bottom: 10px;
}

#load-pct {
	color: #ffdb80;
}

#load-bar {
	height: 12px;
	background: #0a0d1a;
	border: 2px solid #3a4266;
	position: relative;
	overflow: hidden;
}

#load-fill {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0%;
	background: repeating-linear-gradient(90deg, #ffdb80 0 8px, #e8b85a 8px 10px);
	box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35);
}

#load-hint {
	margin-top: 10px;
	font-size: 14px;
	color: #8c94ad;
	text-align: center;
}

#status-notice {
	font-size: 18px;
	line-height: 1.5;
	text-align: center;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			這個瀏覽器不支援 canvas。
		</canvas>

		<noscript>
			請開啟 JavaScript 才能玩。
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--false" src="index.png" alt="">
			<div id="status-progress" class="load-box">
				<div id="load-row"><span id="load-text">載入中…</span><span id="load-pct"></span></div>
				<div id="load-bar"><div id="load-fill"></div></div>
				<div id="load-hint">第一次載入約 65 MB，請稍候</div>
			</div>
			<div id="status-notice" class="load-box"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":27379500,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadText = document.getElementById('load-text');
	const loadPct = document.getElementById('load-pct');
	const loadFill = document.getElementById('load-fill');

	const MSG_LOAD_FAILED = '無法讀取遊戲，\n請重新整理頁面。';
	const MSG_UNSUPPORTED = '這個瀏覽器無法執行遊戲，\n請改用最新版的 Chrome、Edge 或 Firefox。';

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line, i) => {
			if (i > 0) {
				statusNotice.appendChild(document.createElement('br'));
			}
			statusNotice.appendChild(document.createTextNode(line));
		});
	}

	// 錯誤細節只印在主控台；畫面上一律顯示中文訊息。
	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(MSG_LOAD_FAILED);
		setStatusMode('notice');
		initializing = false;
	}

	// 進度：total 為 0（還不知道大小）只顯示「載入中…」；每 2% 一格；到 100% 顯示「準備好了」。
	function setProgress(current, total) {
		if (!(current > 0 && total > 0)) {
			loadText.textContent = '載入中…';
			loadPct.textContent = '';
			loadFill.style.width = '0%';
			return;
		}
		const p = Math.min(100, Math.floor((current / total) * 100));
		loadFill.style.width = (Math.floor(p / 2) * 2) + '%';
		loadPct.textContent = p + '%';
		loadText.textContent = p >= 100 ? '準備好了' : '載入中…';
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			console.error('Missing features required to run Godot projects on the Web:\n' + missing.join('\n'));
			setStatusNotice(MSG_UNSUPPORTED);
			setStatusMode('notice');
			initializing = false;
		}
	} else {
		setStatusMode('progress');
		setProgress(0, 0);
		engine.startGame({
			'onProgress': setProgress,
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
